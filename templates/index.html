<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autogémeos | Stand de Veículos Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body { background-color: #0A0A0A; color: white; font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .accent-color { color: #F06418; }
        .bg-accent { background-color: #F06418; }
        .border-accent { border-color: #F06418; }
        .glass { background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(10px); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>

<body class="custom-scrollbar">

    <nav class="flex justify-between items-center px-6 md:px-12 py-6 glass fixed w-full z-50 border-b border-white/5">
        <div class="flex items-center gap-2">
            <span class="text-2xl font-bold tracking-tighter uppercase italic">
                Auto<span class="accent-color">Gémeos</span>
            </span>
        </div>

        <div class="hidden md:flex gap-8 text-gray-400 font-medium">
            <a href="/" class="text-white transition">Início</a>
            <a href="/veiculos" class="hover:text-white transition">Veículos</a>
            <a href="/sobre" class="hover:text-white transition">Sobre Nós</a>
            <a href="/contacto" class="hover:text-white transition">Contacto</a>
        </div>

        <a href="/veiculos" class="bg-accent text-white px-6 py-2 rounded-lg font-bold hover:opacity-90 transition">
            Ver Stock
        </a>
    </nav>

    <header class="relative h-screen flex items-center px-6 md:px-12 pt-20">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=1920"
                 class="w-full h-full object-cover opacity-40">
            <div class="absolute inset-0 bg-gradient-to-r from-black via-black/60 to-transparent"></div>
        </div>

        <div class="relative z-10 max-w-4xl">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/10 mb-6">
                <span class="w-2 h-2 rounded-full bg-accent animate-pulse"></span>
                <span class="text-xs font-semibold uppercase tracking-widest text-gray-300">
                    Stand Premium em Lisboa
                </span>
            </div>

            <h1 class="text-5xl md:text-8xl font-bold leading-none mb-6">
                O Seu Próximo <br>
                <span class="accent-color">Veículo de Sonho</span> <br>
                Está Aqui
            </h1>

            <p class="text-gray-400 text-lg md:text-xl max-w-xl mb-10 leading-relaxed">
                Descubra a nossa seleção exclusiva de veículos de luxo e performance.
                Qualidade certificada e financiamento à sua medida na Autogémeos.
            </p>

            <div class="flex flex-wrap gap-4">
                <a href="/veiculos"
                   class="bg-accent text-white px-8 py-4 rounded-xl font-bold flex items-center gap-2 hover:scale-105 transition">
                    Explorar Stock <span>→</span>
                </a>

                <a href="/sobre"
                   class="bg-white/5 border border-white/10 px-8 py-4 rounded-xl font-bold hover:bg-white/10 transition">
                    Conhecer o Stand
                </a>
            </div>
        </div>
    </header>

</body>
</html>
